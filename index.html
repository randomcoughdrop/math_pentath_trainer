<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pent 'Em In</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <a href="../">&larr; All games</a>
    <h1>Pent 'Em In</h1>
  </header>

  <main>
    <p id="status">Loading...</p>

    <div class="board-wrapper">
      <canvas id="board" width="1300" height="900" role="img" aria-label="Pent 'Em In game board"></canvas>
    </div>

    <section class="trays">
      <div class="tray">
        <h2 id="tray-title-1">Player 1</h2>
        <canvas id="tray-1" role="img" aria-label="Player 1 piece tray"></canvas>
      </div>
      <div class="tray">
        <h2 id="tray-title-2">Player 2</h2>
        <canvas id="tray-2" role="img" aria-label="Player 2 piece tray"></canvas>
      </div>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
